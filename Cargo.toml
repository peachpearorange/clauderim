[package]
name = "skyrim2"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", features = ["wav"] }
avian3d = "0.7.0"
fidget = { version = "0.5.0", default-features = false, features = ["mesh"] }
nalgebra = "0.35.0"
bevy_hanabi = { version = "0.19.0", default-features = false, features = ["3d"] }
serde = { version = "1.0.229", features = ["derive"] }
json5 = "1.3.1"
enum-assoc = "1.4.1"
web-time = "1.1.0"

[features]
dev = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.1", features = ["wav", "webgpu"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

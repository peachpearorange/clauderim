<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Vibe Scrolls V: Clauderim</title>
    <script>
      (() => {
        const lingering = { debug: 4200, log: 4200, info: 4200, warn: 8000, error: 30000 };
        const kept = 12;
        const describe = (value) =>
          value instanceof Error ? value.stack || String(value)
          : typeof value === "object" && value !== null ? (() => {
              try { return JSON.stringify(value); } catch { return String(value); }
            })()
          : String(value);
        const formatted = (args) => {
          const [first, ...rest] = args;
          const text = typeof first === "string"
            ? first.replace(/%[csdifoO]/g, (spec) => {
                const arg = rest.shift();
                return spec === "%c" ? "" : describe(arg);
              })
            : describe(first);
          return [text, ...rest.map(describe)].join(" ");
        };
        const board = () => document.getElementById("console") || (() => {
          const list = document.createElement("div");
          list.id = "console";
          document.body.append(list);
          return list;
        })();
        const fade = (line, level) => {
          clearTimeout(line.timer);
          line.timer = setTimeout(() => {
            line.classList.add("gone");
            setTimeout(() => line.remove(), 900);
          }, lingering[level]);
        };
        const show = (level, text) => {
          const list = board();
          const last = list.lastElementChild;
          const repeat = last && !last.classList.contains("gone") && last.dataset.text === text;
          const line = repeat ? last : document.createElement("div");
          repeat
            ? (line.dataset.count = `×${Number(line.dataset.count.slice(1) || 1) + 1}`)
            : (line.className = `line ${level}`,
               line.dataset.text = text,
               line.dataset.count = "",
               line.textContent = text,
               list.append(line));
          fade(line, level);
          [...list.children].slice(0, -kept).forEach((old) => old.remove());
        };
        const queued = [];
        const note = (level, text) =>
          document.body ? show(level, text) : queued.push([level, text]);
        document.addEventListener("DOMContentLoaded", () =>
          queued.splice(0).forEach(([level, text]) => show(level, text)));
        Object.keys(lingering).forEach((level) => {
          const original = console[level].bind(console);
          console[level] = (...args) => {
            original(...args);
            note(level, formatted(args));
          };
        });
        addEventListener("error", (event) =>
          note("error", event.error ? describe(event.error)
            : `${event.message} (${event.filename}:${event.lineno})`));
        addEventListener("unhandledrejection", (event) =>
          note("error", `Unhandled rejection: ${describe(event.reason)}`));
      })();
    </script>
    <script>
      (() => {
        const contexts = [];
        const gestures = ["click", "mousedown", "pointerup", "touchend", "keydown"];
        self.AudioContext = new Proxy(self.AudioContext, {
          construct(target, args) {
            const context = new target(...args);
            contexts.push(context);
            return context;
          }
        });
        const resume = () => {
          contexts.forEach((context) => context.state !== "running" && context.resume());
          contexts.length > 0 && contexts.every((context) => context.state === "running") &&
            gestures.forEach((name) => document.removeEventListener(name, resume));
        };
        gestures.forEach((name) => document.addEventListener(name, resume));
      })();
    </script>
    <link data-trunk rel="rust" data-wasm-opt="3" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
    <link data-trunk rel="copy-dir" href="assets" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
      #loading {
        position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 3vmin; background: #000;
        color: #efeee8; font: 300 2.2vmin Georgia, "Times New Roman", serif;
        letter-spacing: 0.3em; text-transform: uppercase; text-align: center;
      }
      #loading h1 { margin: 0; font-weight: 400; font-size: 5vmin; letter-spacing: 0.12em; }
      #loading .ring {
        width: 5vmin; height: 5vmin; border-radius: 50%;
        border: 0.3vmin solid rgba(239, 238, 232, 0.15); border-top-color: #efeee8;
        animation: turn 1.4s linear infinite;
      }
      #loading .status { opacity: 0.75; animation: breathe 2.4s ease-in-out infinite; }
      #loading.failed .ring { display: none; }
      #loading.failed .status { animation: none; letter-spacing: 0.1em; text-transform: none; }
      @font-face {
        font-family: "Noto Sans SemiCondensed";
        src: url("assets/fonts/NotoSans-SemiCondensed.ttf");
      }
      #console {
        position: fixed; left: 3.6vmin; bottom: 3.6vmin; z-index: 2; max-width: 60vw;
        display: flex; flex-direction: column; gap: 0.35vmin; pointer-events: none;
        font: 1.85vmin/1.3 "Noto Sans SemiCondensed", "Noto Sans", sans-serif;
        color: rgba(242, 240, 232, 0.96); text-shadow: 0 0.15vmin 0.3vmin rgba(0, 0, 0, 0.7);
      }
      #console .line {
        white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9em; overflow: hidden;
        animation: arrive 0.3s ease-out both; transition: opacity 0.9s;
      }
      #console .line.gone { opacity: 0; }
      #console .debug { color: rgba(204, 201, 194, 0.6); }
      #console .warn { color: rgba(236, 214, 160, 0.96); }
      #console .error { color: rgba(240, 150, 132, 0.98); }
      #console .line[data-count]:not([data-count=""])::after {
        content: " " attr(data-count); color: rgba(204, 201, 194, 0.6);
      }
      @keyframes arrive { from { opacity: 0; } }
      @keyframes turn { to { transform: rotate(1turn); } }
      @keyframes breathe { 50% { opacity: 0.35; } }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>The Vibe Scrolls V: Clauderim</h1>
      <div class="ring"></div>
      <div class="status">Loading</div>
    </div>
    <script>
      if (!navigator.gpu) {
        document.getElementById("loading").classList.add("failed");
        document.querySelector("#loading .status").textContent =
          "This game needs WebGPU. Try a recent Chrome or Edge.";
      }
      addEventListener("error", () => {
        const loading = document.getElementById("loading");
        loading && loading.classList.add("failed");
        loading && (loading.querySelector(".status").textContent = "The game failed to start.");
      });
    </script>
    <script>
      document.addEventListener("click", () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      });
    </script>
  </body>
</html>

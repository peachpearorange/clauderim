<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Vibe Scrolls V: Clauderim</title>
    <script>
      (() => {
        const shown = new Map();
        const limit = 40;
        const formatted = (args) => {
          const [first, ...rest] = args;
          const text = typeof first === "string"
            ? first.replace(/%[csdifoO]/g, (spec) => {
                const arg = rest.shift();
                return spec === "%c" ? "" : String(arg);
              })
            : describe(first);
          return [text, ...rest.map(describe)].join(" ");
        };
        const describe = (value) =>
          value instanceof Error ? value.stack || String(value)
          : typeof value === "object" && value !== null ? (() => {
              try { return JSON.stringify(value); } catch { return String(value); }
            })()
          : String(value);
        const panel = () => document.getElementById("console-errors") || (() => {
          const box = document.createElement("div");
          box.id = "console-errors";
          const head = document.createElement("div");
          head.className = "head";
          head.textContent = "Errors";
          const close = document.createElement("button");
          close.textContent = "×";
          close.title = "Hide";
          close.addEventListener("click", (event) => {
            event.stopPropagation();
            box.hidden = true;
          });
          head.append(close);
          const list = document.createElement("ol");
          box.append(head, list);
          document.body.append(box);
          return box;
        })();
        const report = (text) => {
          const known = shown.get(text);
          known ? (known.count += 1, known.item.dataset.count = `×${known.count}`)
          : shown.size < limit && document.body && (() => {
              const box = panel();
              const item = document.createElement("li");
              item.textContent = text;
              box.querySelector("ol").append(item);
              box.hidden = false;
              item.scrollIntoView({ block: "nearest" });
              shown.set(text, { item, count: 1 });
            })();
        };
        const queued = [];
        const note = (text) =>
          document.body ? report(text) : queued.push(text);
        document.addEventListener("DOMContentLoaded", () => queued.splice(0).forEach(report));
        const error = console.error.bind(console);
        console.error = (...args) => {
          error(...args);
          note(formatted(args));
        };
        addEventListener("error", (event) =>
          note(event.error ? describe(event.error)
            : `${event.message} (${event.filename}:${event.lineno})`));
        addEventListener("unhandledrejection", (event) =>
          note(`Unhandled rejection: ${describe(event.reason)}`));
      })();
    </script>
    <script>
      (() => {
        const contexts = [];
        const gestures = ["click", "mousedown", "pointerup", "touchend", "keydown"];
        self.AudioContext = new Proxy(self.AudioContext, {
          construct(target, args) {
            const context = new target(...args);
            contexts.push(context);
            return context;
          }
        });
        const resume = () => {
          contexts.forEach((context) => context.state !== "running" && context.resume());
          contexts.length > 0 && contexts.every((context) => context.state === "running") &&
            gestures.forEach((name) => document.removeEventListener(name, resume));
        };
        gestures.forEach((name) => document.addEventListener(name, resume));
      })();
    </script>
    <link data-trunk rel="rust" data-wasm-opt="3" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
    <link data-trunk rel="copy-dir" href="assets" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
      #loading {
        position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 3vmin; background: #000;
        color: #efeee8; font: 300 2.2vmin Georgia, "Times New Roman", serif;
        letter-spacing: 0.3em; text-transform: uppercase; text-align: center;
      }
      #loading h1 { margin: 0; font-weight: 400; font-size: 5vmin; letter-spacing: 0.12em; }
      #loading .ring {
        width: 5vmin; height: 5vmin; border-radius: 50%;
        border: 0.3vmin solid rgba(239, 238, 232, 0.15); border-top-color: #efeee8;
        animation: turn 1.4s linear infinite;
      }
      #loading .status { opacity: 0.75; animation: breathe 2.4s ease-in-out infinite; }
      #loading.failed .ring { display: none; }
      #loading.failed .status { animation: none; letter-spacing: 0.1em; text-transform: none; }
      #console-errors {
        position: fixed; left: 1vmin; right: 1vmin; bottom: 1vmin; z-index: 2;
        max-height: 35vh; display: flex; flex-direction: column;
        background: rgba(20, 6, 6, 0.9); border: 1px solid #a33; border-radius: 4px;
        color: #f3d6d0; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
      }
      #console-errors[hidden] { display: none; }
      #console-errors .head {
        display: flex; justify-content: space-between; align-items: center;
        padding: 4px 8px; color: #ff8a7a; font-weight: bold; border-bottom: 1px solid #5a2020;
      }
      #console-errors button {
        background: none; border: 0; color: inherit; font: inherit; font-size: 16px; cursor: pointer;
      }
      #console-errors ol { margin: 0; padding: 4px 8px 6px 2.5em; overflow: auto; }
      #console-errors li { white-space: pre-wrap; word-break: break-word; margin: 2px 0; }
      #console-errors li[data-count]::after { content: " " attr(data-count); color: #ff8a7a; }
      @keyframes turn { to { transform: rotate(1turn); } }
      @keyframes breathe { 50% { opacity: 0.35; } }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>The Vibe Scrolls V: Clauderim</h1>
      <div class="ring"></div>
      <div class="status">Loading</div>
    </div>
    <script>
      if (!navigator.gpu) {
        document.getElementById("loading").classList.add("failed");
        document.querySelector("#loading .status").textContent =
          "This game needs WebGPU. Try a recent Chrome or Edge.";
      }
      addEventListener("error", () => {
        const loading = document.getElementById("loading");
        loading && loading.classList.add("failed");
        loading && (loading.querySelector(".status").textContent = "The game failed to start.");
      });
    </script>
    <script>
      document.addEventListener("click", () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      });
    </script>
  </body>
</html>
